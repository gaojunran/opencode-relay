# opencode-relay 配置文件示例
# 默认路径: ~/.config/opencode-relay/config.toml
# 可用环境变量 OPENCODE_RELAY_CONFIG 覆盖路径
# 修改后重启 opencode 会话生效（插件启动时读取一次）

[general]
# 插件总开关
enabled = true
# home 目录：会话 directory 必须在 home 内插件才加载，否则 opt-out（不加载任何插件逻辑）
# 不设置时默认取 $HOME（用户主目录）；一般无需修改
# home = "/home/nebula"
# 日志级别: debug | info | warn | error
log_level = "info"

# ---------- 路径 ----------

[paths]
# 主副本根目录：项目的干净基线，Agent 永不直接写
workspace_root = "~/workspace"
# worktree 根目录：Agent 的工作副本（switch_project 无条件在此创建独立 worktree）
worktree_root = "~/.opencode/worktrees"
# 状态目录：当前项目状态按 sessionID 隔离存放
state_dir = "~/.opencode/state"

# ---------- 项目注册表 ----------

[projects]
# 两种方式二选一：
# 1. 显式列出（推荐，list_project 只暴露 id/name，路径对 Agent 不可见）
# 2. 自动扫描：设置 scan_dir，插件收集该目录下含 .git 的子目录作为项目
#    scan_dir = "~/workspace"
#    显式列表优先于扫描；扫描模式下 repo_path 自动生成

[[projects.items]]
id = "relay"
name = "opencode-relay"
repo_path = "~/workspace/relay"
description = "opencode-relay 项目本体"

[[projects.items]]
id = "projA"
name = "projA"
repo_path = "~/workspace/projA"

[[projects.items]]
id = "projB"
name = "projB"
repo_path = "~/workspace/projB"

# ---------- worktree 生命周期 ----------

[worktree]
# worktree 分支前缀，实际分支 = branch_prefix + <sessionID 短id>
branch_prefix = "opencode/"
# 会话结束（dispose）策略:
#   keep    - 保留分支 + worktree 目录，用户手动 review/merge（默认）
#   push    - 自动 git push 分支到 remote，并在日志提示开 PR
#   cleanup - 删除 worktree 目录（分支保留）
end_of_session = "keep"
# 自动 push 时使用的远程名
remote = "origin"
# 不活跃回收阈值（天）：worktree 最后活动超过该天数即被视为可回收（4.8 节）
stale_days = 7

# ---------- 上下文注入 ----------

[inject]
# 每轮向 system prompt 注入当前项目上下文
enabled = true
# 注入模板，支持占位符: {project_id} {project_name} {workdir} {branch}
template = "当前项目: {project_name}（{project_id}），工作目录: {workdir}，分支: {branch}。bash 工具请用 workdir 参数，文件操作用绝对路径，不要直接修改主副本。"
# 会话尚未切换项目时，向 system prompt 注入可用项目清单，引导 Agent 调用 switch_project
list_projects = true

# ---------- 防绕过 ----------

[guard]
# 工具层硬拦截（tool.execute.before）
enabled = true
# 超出当前项目工作目录时拒绝执行（false 则仅记录日志不拦截）
reject_on_violation = true
# 额外的拒绝路径模式（glob），追加到默认拒绝集（workspace_root 全量 + 工作目录之外）
deny_paths = [
  # "/home/nebula/private/**",
]
# 额外的放行路径模式（glob），优先级高于 deny_paths
allow_paths = [
  # "/home/nebula/.opencode/**",
]

# ---------- 权限规则兜底（可选） ----------

# 透传给 opencode agent 的 permissions 规则，作为插件被禁用时的最后防线。
# 留空则使用插件内置默认（worktree allow / 主副本 deny / 其余 ask）。
# 注意: cc-connect 配了 mode = "yolo" 时 opencode 权限层会被跳过。
[permissions]
enabled = false
rules = [
  # { action = "*", resource = "*", effect = "ask" },
  # { action = "bash", resource = "*", effect = "allow" },
  # { action = "write", resource = "/home/nebula/workspace/**", effect = "deny" },
]

# ---------- list_project 展示 ----------

[list]
# 是否在 list_project 返回 description 字段
include_description = true
