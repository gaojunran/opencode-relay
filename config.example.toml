# opencode-relay example configuration
# Default path: ~/.config/opencode-relay/config.toml
# Override the path with the OPENCODE_RELAY_CONFIG environment variable
# Changes take effect after restarting the opencode session (the plugin reads the config once at startup)

[general]
# Master switch
enabled = true
# Home directory: the plugin loads only when the session directory is inside home, otherwise it opts out (loads no plugin logic)
# Defaults to $HOME when unset; usually no need to change
# home = "/home/nebula"
# Log level: debug | info | warn | error
log_level = "info"
# Optional directory for persistent logs. When set, every log line (logfmt format:
# ts=... level=... msg=...) is appended to <dir>/relay-<YYYY-MM-DD>.log (daily rotation)
# in addition to the console. A failed log write never breaks the plugin. Leave empty to
# log to console only.
log_file = ""

# ---------- Paths ----------

[paths]
# Main-copy root: clean baseline of projects, never written by the agent directly
workspace_root = "~/workspace"
# Worktree root: agent working copies (switch_project unconditionally creates an isolated worktree here)
worktree_root = "~/.opencode/worktrees"
# State dir: current project state stored per sessionID
state_dir = "~/.opencode/state"

# ---------- Project registry ----------

[projects]
# Pick one of the two ways:
# 1. Explicit list (recommended: list_project only exposes id/name, paths stay invisible to the agent)
# 2. Auto-scan: set scan_dir and the plugin collects subdirectories containing .git as projects
#    scan_dir = "~/workspace"
#    The explicit list takes precedence over scanning; repo_path is generated automatically in scan mode

[[projects.items]]
id = "relay"
name = "opencode-relay"
repo_path = "~/workspace/relay"
description = "The opencode-relay project itself"
# Base branch worktrees fork from. Empty/absent = the main copy's current HEAD.
# A plain string is used directly as the git ref:
# base_branch = "main"
# A command runs in the main copy and its trimmed stdout is used as the ref
# (e.g. the repo's default remote branch); on failure it falls back to HEAD:
# base_branch = { command = "git symbolic-ref refs/remotes/origin/HEAD" }
# Example: fork from the origin branch with the largest v-prefixed semver tag:
#   base_branch = { command = "git for-each-ref refs/remotes/origin/ --format='%(refname:short)' | grep -E '^origin/v[0-9]+(\\.[0-9]+){1,2}$' | sort -V | tail -1" }
# Fetch the main copy's remotes before creating a worktree, so remote refs (and the
# command above) see current state. Default true.
# fetch = true

[[projects.items]]
id = "projA"
name = "projA"
repo_path = "~/workspace/projA"
# Project-level on_switch: commands run in the new worktree after switch_project, env
# output merged into the session (overrides [worktree].on_switch for this project):
# on_switch = ["mise env", "direnv export bash"]

[[projects.items]]
id = "projB"
name = "projB"
repo_path = "~/workspace/projB"

# ---------- Worktree lifecycle ----------

[worktree]
# Worktree branch prefix; actual branch = branch_prefix + <sessionID full sanitized id>
branch_prefix = "opencode/"
# Session-end (dispose) strategy:
#   keep    - keep the branch + worktree dir for manual review/merge (default)
#   push    - auto git push the branch to remote
#   cleanup - delete the worktree dir (the branch stays)
end_of_session = "keep"
# Remote name used for auto push
remote = "origin"
# Inactivity reclaim threshold (days): a worktree whose last activity exceeds this is considered reclaimable (section 4.8)
stale_days = 7
# Commands run (in order) once when a project is switched, with the worktree as cwd. Each
# command's stdout is parsed as an env dump (KEY=VALUE / export KEY=VALUE lines, e.g. `mise env`
# or `direnv export bash`) and merged into the session env, injected into every bash invocation
# via the shell.env hook (later commands override same-named keys). {{dir}} is replaced with the
# worktree path. Failures are logged and never block the switch.
# on_switch = ["mise env", "direnv export bash"]
on_switch = []
# After forking a new worktree, check the main copy out to the base ref, so the clean
# baseline stays on the most recently used base_branch (default true).
checkout_main_copy = true

# ---------- Context injection ----------

[inject]
# Inject the current project context into the system prompt every round
enabled = true
# Injection template with placeholders: {project_id} {project_name} {workdir} {branch}
template = "Current project: {project_name} ({project_id}), workdir: {workdir}, branch: {branch}. Use the workdir parameter for bash, absolute paths for file operations, and never modify the main copy."
# When the session has not switched to a project yet, inject the available project list into the system prompt to guide the agent to call switch_project
list_projects = true
# After switching, inject the worktree-root instruction file (AGENTS.md / CLAUDE.md / CONTEXT.md,
# opencode's precedence) into the system prompt. Worktrees are not scanned by opencode's own
# findUp-based instruction loading, so this restores project-level instructions.
agents_md = true
# After switching, list project skills shipped in the worktree (.opencode/skills or .opencode/skill)
# in the system prompt so the agent can load them with the skill tool.
skills = true
# A fixed guide is always injected: use switch_project for projects, and register_project for repositories not yet in the list

# ---------- Anti-bypass ----------

[guard]
# Hard interception at the tool layer (tool.execute.before)
enabled = true
# Reject execution when outside the current project working dir (false: log only, do not intercept)
reject_on_violation = true
# Additional deny path patterns (glob), appended to the default deny set.
# The default deny set always contains workspace_root/** (the main copy), in every session
# state: even before a project is switched, the agent may work freely in home but must not
# touch the main copies directly.
deny_paths = [
  # "/home/nebula/private/**",
]
# Additional allow path patterns (glob), with higher precedence than deny_paths
allow_paths = [
  # "/home/nebula/.opencode/**",
]
# Directories outside the worktree that are always allowed (e.g. temp dirs). Empty list disables this.
# Defaults to ["/tmp"] when omitted.
allow_dirs = [
  "/tmp",
]

# ---------- Permission rules fallback (optional) ----------

# Permissions rules forwarded to the opencode agent, as the last line of defense when the plugin is disabled.
# Leave empty to use the plugin's built-in defaults (worktree allow / main-copy deny / everything else ask).
# Note: the opencode permission layer is skipped when cc-connect is configured with mode = "yolo".
[permissions]
enabled = false
rules = [
  # { action = "*", resource = "*", effect = "ask" },
  # { action = "bash", resource = "*", effect = "allow" },
  # { action = "write", resource = "/home/nebula/workspace/**", effect = "deny" },
]

# ---------- list_project display ----------

[list]
# Whether list_project returns the description field
include_description = true
